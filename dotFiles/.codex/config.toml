model = "gpt-6-astra"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"

# model_context_window = 1000000
# model_auto_compact_token_limit = 900000

personality = "pragmatic"

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

web_search = "live"
model_verbosity = "low"

[notice]
hide_rate_limit_model_nudge = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "permissions", "context-used", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true
terminal_title = ["activity", "project-name", "app-name", "current-dir", "run-state", "context-remaining"]
theme = "inspired-github"
screen_reader_detection_done = true

[features]
terminal_resize_reflow = true
memories = true
mentions_v2 = true
network_proxy = true
token_budget = true

[agents]
enabled = true

[memories]
no_memories_if_mcp_or_web_search = true

[sandbox_workspace_write]
network_access = true
